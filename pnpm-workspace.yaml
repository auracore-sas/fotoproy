packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 (strictDepBuilds=true) fails the install when a dependency has a
# lifecycle script that is not approved. These are the only packages in the
# tree that need one: Prisma downloads its query engines and generates the
# client. Note: pnpm 11 replaced `onlyBuiltDependencies` with this map.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
