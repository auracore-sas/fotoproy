# FotoProy — production stack (single host: Docker Compose + Caddy with
# automatic HTTPS via Let's Encrypt).
#
# Day-to-day usage on the server (full runbook: docs/deployment.md):
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm api pnpm --filter @fotoproy/database db:deploy
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f api
#
# The database is optional:
#   - managed PostgreSQL (Neon / Supabase / RDS): just set DATABASE_URL in
#     apps/api/.env and do NOT enable the profile below;
#   - PostgreSQL on this same host: add `--profile selfhosted-db`.
#
# Required shell variables (or a `.env` file next to this compose file):
#   DOMAIN       public hostname that points to this server, e.g. api.fotoproy.com
#   ACME_EMAIL   email for Let's Encrypt notifications

name: fotoproy

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fotoproy-api:latest
    restart: unless-stopped
    env_file:
      - apps/api/.env
    expose:
      - '4100'
    # Published on loopback only: all public traffic goes through Caddy.
    ports:
      - '127.0.0.1:4100:4100'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN (public hostname) before starting the stack}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional: PostgreSQL on this host. Enable with `--profile selfhosted-db`.
  # PostGIS is NOT required (coordinates are stored as Decimal — decision F0.4).
  db:
    image: postgres:16-bookworm
    profiles: ['selfhosted-db']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fotoproy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fotoproy}
    volumes:
      - fotoproy_pgdata:/var/lib/postgresql/data
    # Not published: only the API container needs to reach it.
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fotoproy} -d ${POSTGRES_DB:-fotoproy}']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  fotoproy_pgdata:
